spring.application.name=chanplay

# 기본 프로필: local (개발 서버에서는 --spring.profiles.active=dev 로 실행)
spring.profiles.default=local

logging.level.root=INFO
server.port=8080

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/soondb?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=soon
spring.datasource.password=soon0314

# 스키마는 Flyway 마이그레이션(src/main/resources/db/migration)으로 관리
# Hibernate 는 엔티티와 DB 구조가 일치하는지 검사만 함
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

spring.output.ansi.enabled=always

# Spring Data REST 가 루트(/)를 차지하지 않도록 경로 분리 (루트는 React 화면)
spring.data.rest.base-path=/api
