plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.5'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.chanai'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-data-rest'
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.flywaydb:flyway-mysql'
	// Flyway 11 은 Jackson 2(com.fasterxml)를 사용 (Spring Boot 4 기본은 Jackson 3)
	// 간접 의존성이라 IDE 실행 시 빠지는 경우가 있어 명시
	implementation 'com.fasterxml.jackson.core:jackson-databind'
	
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	runtimeOnly 'com.mysql:mysql-connector-j'
}

tasks.named('test') {
	useJUnitPlatform()
}

// ===== React 빌드 결과를 jar 에 포함 =====
// ./gradlew bootJar 실행 시 frontend 를 빌드해서 static/ 에 넣음
// (frontend 빌드를 건너뛰려면 -PskipFrontend)
def frontendDir = file('../frontend')
def isWindows = System.getProperty('os.name').toLowerCase().contains('windows')

tasks.register('buildFrontend', Exec) {
	workingDir frontendDir
	commandLine isWindows ? ['cmd', '/c', 'npm', 'run', 'build'] : ['npm', 'run', 'build']
	onlyIf { !project.hasProperty('skipFrontend') }
}

tasks.named('processResources') {
	dependsOn 'buildFrontend'
	from(new File(frontendDir, 'dist')) {
		into 'static'
	}
}
